<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <title>Earth Project</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
                width: 100%;
                height: 100%;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                color: #fff;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            #canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            #hud {
                position: fixed;
                top: 20px;
                left: 20px;
                min-width: 240px;
                padding: 16px 20px 14px;
                background: rgba(0, 0, 0, 0.42);
                backdrop-filter: blur(14px) saturate(140%);
                -webkit-backdrop-filter: blur(14px) saturate(140%);
                border: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 8px;
                font-size: 12.5px;
                line-height: 1.5;
                color: rgba(255, 255, 255, 0.92);
                pointer-events: none;
                user-select: none;
                letter-spacing: 0.015em;
            }
            #hud h2 {
                margin: 0 0 4px;
                font-size: 9.5px;
                font-weight: 600;
                letter-spacing: 0.24em;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.38);
            }
            #hud section + section {
                margin-top: 11px;
                padding-top: 11px;
                border-top: 1px solid rgba(255, 255, 255, 0.06);
            }
            #hud .row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 18px;
            }
            #hud .k {
                color: rgba(255, 255, 255, 0.5);
                font-size: 11.5px;
            }
            #hud .v {
                font-variant-numeric: tabular-nums;
                color: rgba(255, 255, 255, 0.96);
                text-align: right;
            }
            #hud .v.dim {
                color: rgba(255, 255, 255, 0.65);
                font-size: 11px;
            }
            #disclaimer {
                position: fixed;
                bottom: 14px;
                left: 20px;
                right: 20px;
                font-size: 10.5px;
                color: rgba(255, 255, 255, 0.32);
                letter-spacing: 0.06em;
                pointer-events: none;
                user-select: none;
                display: flex;
                justify-content: space-between;
                gap: 20px;
            }
            #disclaimer .live::before {
                content: '';
                display: inline-block;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #4ad4c8;
                margin-right: 7px;
                vertical-align: middle;
                box-shadow: 0 0 8px rgba(74, 212, 200, 0.6);
                animation: livepulse 2.4s ease-in-out infinite;
            }
            @keyframes livepulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.35; }
            }
            #hint {
                position: fixed;
                top: 22px;
                right: 22px;
                font-size: 10.5px;
                color: rgba(255, 255, 255, 0.28);
                letter-spacing: 0.08em;
                pointer-events: none;
                user-select: none;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>

        <div id="hud">
            <section>
                <h2>Earth</h2>
                <div class="row"><span class="k">Axial tilt</span><span class="v" id="hud-tilt">—</span></div>
                <div class="row"><span class="k">Rotation angle</span><span class="v" id="hud-rotation">—</span></div>
                <div class="row"><span class="k">Subsolar lat</span><span class="v" id="hud-sub-lat">—</span></div>
                <div class="row"><span class="k">Subsolar lon</span><span class="v" id="hud-sub-lon">—</span></div>
            </section>
            <section>
                <h2>Sun</h2>
                <div class="row"><span class="k">Ecliptic longitude</span><span class="v" id="hud-sun-lon">—</span></div>
            </section>
            <section>
                <h2>Moon</h2>
                <div class="row"><span class="k">Phase</span><span class="v" id="hud-moon-phase">—</span></div>
                <div class="row"><span class="k">Distance</span><span class="v dim" id="hud-moon-dist">—</span></div>
            </section>
            <section>
                <h2>Time</h2>
                <div class="row"><span class="v" id="hud-time" style="text-align:left; width:100%;">—</span></div>
            </section>
        </div>

        <div id="hint">Drag to orbit · scroll to zoom</div>

        <div id="disclaimer">
            <span class="live">Live data · updates each frame</span>
            <span>Not to scale — positions are astronomically accurate, sizes are not.</span>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
