<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <title>Earth Project</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
                width: 100%;
                height: 100%;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                color: #fff;
            }
            #canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
            #hud {
                position: fixed;
                top: 20px;
                left: 20px;
                padding: 14px 18px;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                font-size: 13px;
                line-height: 1.6;
                letter-spacing: 0.02em;
                color: rgba(255, 255, 255, 0.9);
                pointer-events: none;
                user-select: none;
            }
            #hud .label {
                color: rgba(255, 255, 255, 0.45);
                text-transform: uppercase;
                font-size: 10px;
                letter-spacing: 0.14em;
                margin-right: 8px;
            }
            #hud .value {
                font-variant-numeric: tabular-nums;
            }
            #disclaimer {
                position: fixed;
                bottom: 16px;
                left: 20px;
                font-size: 11px;
                color: rgba(255, 255, 255, 0.35);
                letter-spacing: 0.04em;
                pointer-events: none;
                user-select: none;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="hud">
            <div><span class="label">Axial tilt</span><span class="value" id="hud-tilt">—</span></div>
            <div><span class="label">Rotation</span><span class="value" id="hud-rotation">—</span></div>
            <div><span class="label">Sun ecl. lon.</span><span class="value" id="hud-sun-lon">—</span></div>
            <div><span class="label">Time</span><span class="value" id="hud-time">—</span></div>
        </div>
        <div id="disclaimer">Not to scale — positions are astronomically accurate, sizes are not.</div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
